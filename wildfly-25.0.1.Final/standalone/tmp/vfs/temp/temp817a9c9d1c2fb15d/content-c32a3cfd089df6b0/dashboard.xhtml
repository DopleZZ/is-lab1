<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Flat Management</title>
    <style>
        /* Красно-белая цветовая схема */
        body {
            background: linear-gradient(135deg, #ffffff 0%, #fff5f5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .form-full-width {
            grid-column: 1 / -1;
        }
        .actions {
            margin-top: 1rem;
            text-align: right;
        }
        .data-table {
            margin-top: 2rem;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nested-form {
            border: 2px solid #dc3545;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 0.5rem;
            background: #fff;
        }
        
        /* Стилизация панелей */
        .ui-panel {
            border-radius: 8px !important;
            border: 2px solid #dc3545 !important;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.2) !important;
        }
        
        .ui-panel .ui-panel-titlebar {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%) !important;
            color: white !important;
            font-weight: bold !important;
            border-radius: 6px 6px 0 0 !important;
        }
        
        /* Стилизация таблицы */
        .ui-datatable {
            border-radius: 8px !important;
            overflow: hidden !important;
            box-shadow: 0 2px 12px rgba(220, 53, 69, 0.15) !important;
        }
        
        .ui-datatable thead th {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%) !important;
            color: white !important;
            font-weight: bold !important;
        }
        
        .ui-datatable tbody tr:nth-child(even) {
            background: #fff5f5 !important;
        }
        
        .ui-datatable tbody tr:hover {
            background: #ffe0e0 !important;
        }
        
        /* Стилизация кнопок */
        .p-button {
            border-radius: 6px !important;
            font-weight: 500 !important;
            transition: all 0.3s ease !important;
        }
        
        .p-button-success {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%) !important;
            border-color: #28a745 !important;
        }
        
        .p-button-success:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 4px 8px rgba(40, 167, 69, 0.3) !important;
        }
        
        .p-button-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%) !important;
            border-color: #dc3545 !important;
        }
        
        .p-button-danger:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.3) !important;
        }
        
        .p-button-primary {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%) !important;
            border-color: #007bff !important;
        }
        
        /* Стилизация диалогов */
        .ui-dialog {
            border-radius: 12px !important;
            box-shadow: 0 8px 32px rgba(220, 53, 69, 0.3) !important;
        }
        
        .ui-dialog .ui-dialog-titlebar {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%) !important;
            color: white !important;
            font-weight: bold !important;
            border-radius: 10px 10px 0 0 !important;
        }
        
        /* Стили для полноэкранного диалога */
        .ui-dialog {
            max-width: none !important;
            max-height: none !important;
        }
        
        /* Стили для диалога создания */
        #mainForm\\:createDialog {
            z-index: 1000;
        }
        
        .ui-dialog-content {
            height: calc(95vh - 60px) !important;
            overflow-y: auto;
            padding: 20px;
        }
        
        .ui-dialog-titlebar {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        
        .ui-dialog-titlebar-close {
            color: white !important;
        }
        
        .ui-dialog-titlebar-close:hover {
            background-color: rgba(255, 255, 255, 0.2) !important;
        }
        
        /* Улучшенные стили для формы */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        
        .form-full-width {
            grid-column: 1 / -1;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        
        .actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #fecaca;
        }
        
        /* Исправление aria-hidden проблем */
        .ui-dialog {
            outline: none;
        }
        
        .ui-dialog .ui-dialog-content {
            outline: none;
        }
        
        .ui-dialog .ui-button {
            outline: none;
        }
        
        /* Принудительное исправление aria-hidden */
        .ui-dialog[aria-hidden="true"] {
            display: none !important;
        }
        
        .ui-dialog[aria-hidden="false"] {
            display: block !important;
        }
        
        /* Убираем aria-hidden при показе диалога */
        .ui-dialog.ui-dialog-visible {
            aria-hidden: false !important;
        }
        
        /* Предотвращаем фокус на скрытых элементах */
        .ui-dialog[aria-hidden="true"] * {
            pointer-events: none !important;
        }
        .ui-dialog[aria-hidden="true"] button,
        .ui-dialog[aria-hidden="true"] input,
        .ui-dialog[aria-hidden="true"] select,
        .ui-dialog[aria-hidden="true"] textarea {
            visibility: hidden !important;
        }
        
        /* Стилизация input полей */
        .ui-inputtext, .ui-inputnumber-input {
            border-radius: 6px !important;
            border: 2px solid #dc3545 !important;
            transition: all 0.3s ease !important;
        }
        
        .ui-inputtext:focus, .ui-inputnumber-input:focus {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important;
        }
        
        /* Стилизация меню */
        .ui-menubar {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%) !important;
            border-radius: 8px !important;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.2) !important;
        }
        
        .ui-menubar .ui-menuitem-link {
            color: white !important;
        }
        
        .ui-menubar .ui-menuitem-link:hover {
            background: rgba(255, 255, 255, 0.2) !important;
        }
        
        /* Стилизация заголовков секций */
        h3 {
            color: #dc3545 !important;
            font-weight: bold !important;
            border-bottom: 2px solid #dc3545 !important;
            padding-bottom: 0.5rem !important;
        }
        
        h4 {
            color: #c82333 !important;
            font-weight: 600 !important;
        }
        
        /* Стилизация toggle switch для House и Coordinates */
        .house-toggle .ui-button,
        .coord-toggle .ui-button {
            min-width: 200px !important;
            border-radius: 25px !important;
            transition: all 0.3s ease !important;
        }
        
        .house-toggle .ui-button.ui-state-active,
        .coord-toggle .ui-button.ui-state-active {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%) !important;
            border-color: #28a745 !important;
            color: white !important;
        }
        
        .house-toggle .ui-button:not(.ui-state-active),
        .coord-toggle .ui-button:not(.ui-state-active) {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%) !important;
            border-color: #dc3545 !important;
            color: white !important;
        }
        
        .house-toggle .ui-button:hover,
        .coord-toggle .ui-button:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2) !important;
        }
    </style>
</h:head>
<h:body>
    <h:form id="mainForm">
        <!-- Мгновенное обновление через частый polling (каждые 500ms) -->
        <p:poll interval="0.5" 
                update="flatsTable" 
                action="#{flatMB.refreshData}"
                async="true"
                autoStart="true"
                stop="false"
                widgetVar="refreshPoll"/>
        
        <!-- Навигационное меню -->
        <p:menubar style="margin-bottom: 1rem;">
            <p:menuitem value="Dashboard" outcome="dashboard" icon="pi pi-home"/>
            <p:menuitem value="Special Operations" outcome="special" icon="pi pi-cog"/>
        </p:menubar>
        <!-- Фильтры и сортировка -->
        <p:panel header="Filters and Sorting" style="margin-bottom: 1rem;">
            <h:panelGrid columns="4" style="width: 100%;">
                <p:inputText value="#{flatMB.nameFilter}" placeholder="Filter by name" style="width: 100%;"/>
                <p:selectOneMenu value="#{flatMB.furnishFilter}" style="width: 100%;">
                    <f:selectItem itemLabel="All Furnish" itemValue=""/>
                    <f:selectItems value="#{flatMB.furnishOptions}" />
                </p:selectOneMenu>
                <p:selectOneMenu value="#{flatMB.viewFilter}" style="width: 100%;">
                    <f:selectItem itemLabel="All Views" itemValue=""/>
                    <f:selectItems value="#{flatMB.viewOptions}" />
                </p:selectOneMenu>
                <p:selectOneMenu value="#{flatMB.sortField}" style="width: 100%;">
                    <f:selectItem itemLabel="Name" itemValue="name"/>
                    <f:selectItem itemLabel="Price" itemValue="price"/>
                    <f:selectItem itemLabel="Area" itemValue="area"/>
                    <f:selectItem itemLabel="Rooms" itemValue="numberOfRooms"/>
                    <f:selectItem itemLabel="Time to Metro" itemValue="timeToMetroOnFoot"/>
                </p:selectOneMenu>
            </h:panelGrid>
            <div style="margin-top: 0.5rem;">
                <p:commandButton value="Apply Filters" action="#{flatMB.applyFilters}"
                                 update="flatsTable" icon="pi pi-filter"/>
                <p:commandButton value="Clear Filters" action="#{flatMB.clearFilters}"
                                 update="flatsTable" icon="pi pi-times" styleClass="p-button-secondary"/>
            <p:commandButton value="Create New Flat" 
                             actionListener="#{flatMB.prepareForCreate}"
                             oncomplete="showCreateDialog();" 
                                 update="createForm coordSection houseSection" 
                             icon="pi pi-plus"
                             styleClass="p-button-success"/>
            </div>
        </p:panel>

        <!-- Таблица с квартирами -->
        <p:dataTable id="flatsTable"
                     value="#{flatMB.flats}"
                     var="flat"
                     widgetVar="flatsTable"
                     styleClass="data-table"
                     paginator="true"
                     rows="10"
                     rowsPerPageTemplate="5,10,15"
                     emptyMessage="No flats found">

            <p:column headerText="Name">
                <h:outputText value="#{flat.name}"/>
            </p:column>

            <p:column headerText="Area">
                <h:outputText value="#{flat.area}"/>
            </p:column>

            <p:column headerText="Price">
                <h:outputText value="#{flat.price}"/>
            </p:column>

            <p:column headerText="Rooms">
                <h:outputText value="#{flat.numberOfRooms}"/>
            </p:column>

            <p:column headerText="Furnish">
                <h:outputText value="#{flat.furnish}"/>
            </p:column>

            <p:column headerText="View">
                <h:outputText value="#{flat.view}"/>
            </p:column>

            <p:column headerText="Actions" style="width: 150px;">
                <p:commandButton icon="pi pi-pencil"
                                 title="Edit"
                                 styleClass="p-button-rounded p-button-success p-button-text"
                                 action="#{flatMB.selectFlatForEdit(flat)}"
                                 oncomplete="PF('editDialog').show()"
                                 process="@none"
                                 update="@none"/>

                <p:commandButton icon="pi pi-trash"
                                 title="Delete"
                                 styleClass="p-button-rounded p-button-danger p-button-text"
                                 action="#{flatMB.selectFlatForDelete(flat)}"
                                 oncomplete="PF('deleteDialog').show()"
                                 process="@none"
                                 update="@none"/>
            </p:column>
        </p:dataTable>

        <!-- Диалог создания - ПРОСТОЙ И НАДЕЖНЫЙ -->
        <p:dialog id="createDialog" header="Create New Flat"
                  widgetVar="createDialog"
                  modal="true"
                  resizable="true"
                  style="width: 700px; max-height: 90vh;"
                  closable="true">
            <h:form id="createForm">
                <p:panelGrid columns="2" styleClass="form-grid" style="width: 100%;">
                    
                    <p:outputLabel for="name" value="Name:"/>
                    <p:inputText id="name" value="#{flatMB.selectedFlat.name}" required="true" style="width: 100%;"/>

                    <p:outputLabel for="area" value="Area:"/>
                    <p:inputNumber id="area" value="#{flatMB.selectedFlat.area}" minValue="1" required="true" style="width: 100%;"/>

                    <p:outputLabel for="price" value="Price:"/>
                    <p:inputNumber id="price" value="#{flatMB.selectedFlat.price}" minValue="1" maxValue="1202161207" required="true" style="width: 100%;"/>

                    <p:outputLabel for="rooms" value="Rooms:"/>
                    <p:inputNumber id="rooms" value="#{flatMB.selectedFlat.numberOfRooms}" minValue="1" required="true" style="width: 100%;"/>

                    <p:outputLabel for="metro" value="Time to Metro:"/>
                    <p:inputNumber id="metro" value="#{flatMB.selectedFlat.timeToMetroOnFoot}" minValue="0.1" decimalPlaces="1" required="true" style="width: 100%;"/>

                    <p:outputLabel for="furnish" value="Furnish:"/>
                    <p:selectOneMenu id="furnish" value="#{flatMB.tempFurnish}" required="true" style="width: 100%;">
                        <f:selectItem itemLabel="None" itemValue="NONE"/>
                        <f:selectItem itemLabel="Designer" itemValue="DESIGNER"/>
                        <f:selectItem itemLabel="Bad" itemValue="BAD"/>
                        <f:selectItem itemLabel="Little" itemValue="LITTLE"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="view" value="View:"/>
                    <p:selectOneMenu id="view" value="#{flatMB.tempView}" required="true" style="width: 100%;">
                        <f:selectItem itemLabel="Street" itemValue="STREET"/>
                        <f:selectItem itemLabel="Bad" itemValue="BAD"/>
                        <f:selectItem itemLabel="Terrible" itemValue="TERRIBLE"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="balcony" value="Balcony:"/>
                    <p:selectBooleanCheckbox id="balcony" value="#{flatMB.selectedFlat.balcony}"/>

                    <p:outputLabel for="isNew" value="Is New:"/>
                    <p:selectBooleanCheckbox id="isNew" value="#{flatMB.selectedFlat.isNew}"/>
                    
                </p:panelGrid>

                <!-- Секция Coordinates -->
                <div style="margin: 15px 0; padding: 15px; border: 1px solid #dc2626; border-radius: 5px;">
                    <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 15px;">
                        <label style="font-weight: bold; color: #dc2626; margin-right: 10px;">Coordinates:</label>
                        <p:selectBooleanButton id="createNewCoord" 
                                             value="#{flatMB.createNewCoordinates}"
                                             onLabel="Create New" 
                                             offLabel="Select from DB"
                                             styleClass="coord-toggle">
                            <p:ajax update="coordSection" process="@this"/>
                        </p:selectBooleanButton>
                    </div>

                    <h:panelGroup id="coordSection">
                        <!-- Создание новых координат -->
                        <div rendered="#{flatMB.createNewCoordinates}" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div>
                                <p:outputLabel for="newCoordX" value="X coordinate:"/>
                                <p:inputNumber id="newCoordX" value="#{flatMB.selectedFlat.coordinates.x}" 
                                               minValue="-540" required="#{flatMB.createNewCoordinates}" 
                                               style="width: 100%;"/>
                    </div>
                            <div>
                                <p:outputLabel for="newCoordY" value="Y coordinate:"/>
                                <p:inputNumber id="newCoordY" value="#{flatMB.selectedFlat.coordinates.y}" 
                                               maxValue="568" required="#{flatMB.createNewCoordinates}" 
                                               style="width: 100%;"/>
                        </div>
                    </div>

                    <!-- Выбор существующих координат -->
                        <div rendered="#{not flatMB.createNewCoordinates}">
                            <p:outputLabel for="coordSelect" value="Select Coordinates:"/>
                            <p:selectOneMenu id="coordSelect" value="#{flatMB.selectedCoordinatesId}" 
                                             required="#{not flatMB.createNewCoordinates}" 
                                             style="width: 100%; margin-top: 5px;">
                                <f:selectItem itemLabel="Select Coordinates" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{flatMB.availableCoordinates}" var="c" 
                                               itemLabel="X: #{c.x}, Y: #{c.y}" itemValue="#{c.id}"/>
                            </p:selectOneMenu>
                        </div>
                    </h:panelGroup>
                </div>

                <!-- Секция House -->
                <div style="margin: 15px 0; padding: 15px; border: 1px solid #dc2626; border-radius: 5px;">
                    <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 15px;">
                        <label style="font-weight: bold; color: #dc2626; margin-right: 10px;">House:</label>
                        <p:selectBooleanButton id="createNewHouse" 
                                              value="#{flatMB.createNewHouse}"
                                              onLabel="Create New" 
                                              offLabel="Select from DB"
                                              styleClass="house-toggle">
                            <p:ajax update="houseSection" process="@this"/>
                        </p:selectBooleanButton>
                    </div>
                    
                    <h:panelGroup id="houseSection">
                        <!-- Создание нового дома -->
                        <div rendered="#{flatMB.createNewHouse}" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div style="grid-column: 1 / -1;">
                                <p:outputLabel for="newHouseName" value="House Name:"/>
                                <p:inputText id="newHouseName" value="#{flatMB.newHouse.name}" 
                                             style="width: 100%;"/>
                            </div>
                            <div>
                                <p:outputLabel for="newHouseYear" value="Year:"/>
                                <p:inputNumber id="newHouseYear" value="#{flatMB.newHouse.year}" 
                                               minValue="1" maxValue="497" required="#{flatMB.createNewHouse}"
                                               style="width: 100%;"/>
                            </div>
                            <div>
                                <p:outputLabel for="newHouseFlats" value="Flats per Floor:"/>
                                <p:inputNumber id="newHouseFlats" value="#{flatMB.newHouse.numberOfFlatsOnFloor}" 
                                               minValue="1" required="#{flatMB.createNewHouse}"
                                               style="width: 100%;"/>
                            </div>
                            <div>
                                <p:outputLabel for="newHouseLifts" value="Number of Lifts:"/>
                                <p:inputNumber id="newHouseLifts" value="#{flatMB.newHouse.numberOfLifts}" 
                                               minValue="1" required="#{flatMB.createNewHouse}"
                                               style="width: 100%;"/>
                            </div>
                        </div>

                    <!-- Выбор существующего дома -->
                        <div rendered="#{not flatMB.createNewHouse}">
                            <p:outputLabel for="houseSelect" value="Select House from Database:"/>
                            <p:selectOneMenu id="houseSelect" value="#{flatMB.selectedHouseId}" 
                                             required="#{not flatMB.createNewHouse}" 
                                             style="width: 100%; margin-top: 5px;"
                                             filter="true" 
                                             filterMatchMode="contains"
                                             placeholder="Search and select house...">
                                <f:selectItem itemLabel="Select House" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{flatMB.availableHouses}" var="h" 
                                               itemLabel="#{h.name} (Year: #{h.year}, Flats/Floor: #{h.numberOfFlatsOnFloor}, Lifts: #{h.numberOfLifts})" 
                                               itemValue="#{h.id}"/>
                            </p:selectOneMenu>
                        </div>
                    </h:panelGroup>
                </div>

                <div style="text-align: center; margin-top: 20px;">
                    <p:commandButton value="Create" icon="pi pi-check"
                                     action="#{flatMB.createFlat}"
                                     update=":mainForm:flatsTable :mainForm:growl"
                                     oncomplete="if(!args.validationFailed) { hideCreateDialog(); forceRefreshTable(); }"
                                     styleClass="p-button-success"
                                     style="margin-right: 10px;"/>

                    <p:commandButton value="Cancel" icon="pi pi-times"
                                     onclick="hideCreateDialog();"
                                     type="button"
                                     styleClass="p-button-secondary"/>
                </div>
            </h:form>
        </p:dialog>


        <!-- Диалог редактирования -->
        <p:dialog header="Edit Flat"
                  widgetVar="editDialog"
                  modal="true"
                  resizable="false"
                  style="width: 600px;"
                  closable="true"
                  dynamic="true">
            <h:form id="editForm">
                <div class="form-grid">
                    <!-- Основная информация -->
                    <div class="form-full-width">
                        <h3>Basic Information</h3>
                    </div>

                    <p:inputText id="editName" value="#{flatMB.selectedFlat.name}"
                                 placeholder="Name"
                                 required="true"
                                 requiredMessage="Name is required"/>

                    <p:inputNumber id="editArea" value="#{flatMB.selectedFlat.area}"
                                   placeholder="Area"
                                   minValue="1"
                                   required="true"
                                   requiredMessage="Area is required"/>

                    <p:inputNumber id="editPrice" value="#{flatMB.selectedFlat.price}"
                                   placeholder="Price"
                                   minValue="1"
                                   required="true"
                                   requiredMessage="Price is required"/>

                    <p:inputNumber id="editRooms" value="#{flatMB.selectedFlat.numberOfRooms}"
                                   placeholder="Number of Rooms"
                                   minValue="1"/>

                    <p:inputNumber id="editMetroTime" value="#{flatMB.selectedFlat.timeToMetroOnFoot}"
                                   placeholder="Time to Metro (minutes)"
                                   decimalPlaces="1"
                                   minValue="0.1"/>

                    <!-- Enum поля -->
                    <p:selectOneMenu id="editFurnish" value="#{flatMB.selectedFlat.furnish}"
                                     required="true"
                                     requiredMessage="Furnish is required">
                        <f:selectItems value="#{flatMB.furnishOptions}" />
                    </p:selectOneMenu>

                    <p:selectOneMenu id="editView" value="#{flatMB.selectedFlat.view}"
                                     required="true"
                                     requiredMessage="View is required">
                        <f:selectItems value="#{flatMB.viewOptions}" />
                    </p:selectOneMenu>

                    <!-- Boolean поля -->
                    <div class="checkbox-container">
                        <p:selectBooleanCheckbox id="editBalcony" value="#{flatMB.selectedFlat.balcony}"/>
                        <p:outputLabel value="Balcony" for="editBalcony"/>
                    </div>

                    <div class="checkbox-container">
                        <p:selectBooleanCheckbox id="editIsNew" value="#{flatMB.selectedFlat.isNew}"/>
                        <p:outputLabel value="Is New" for="editIsNew"/>
                    </div>

                    <!-- Координаты -->
                    <div class="form-full-width">
                        <h3>Coordinates</h3>
                    </div>

                    <p:inputNumber id="editCoordX" value="#{flatMB.selectedFlat.coordinates.x}"
                                   placeholder="X coordinate"
                                   required="true"
                                   requiredMessage="X coordinate is required"/>

                    <p:inputNumber id="editCoordY" value="#{flatMB.selectedFlat.coordinates.y}"
                                   placeholder="Y coordinate"
                                   required="true"
                                   requiredMessage="Y coordinate is required"/>

                    <!-- Информация о доме -->
                    <div class="form-full-width">
                        <h3>House Information</h3>
                    </div>

                    <p:inputText id="editHouseName" value="#{flatMB.selectedFlat.house.name}"
                                 placeholder="House Name"
                                 required="true"
                                 requiredMessage="House name is required"/>

                    <p:inputNumber id="editHouseYear" value="#{flatMB.selectedFlat.house.year}"
                                   placeholder="Year"
                                   minValue="1"
                                   maxValue="497"
                                   required="true"
                                   requiredMessage="Year is required"/>

                    <p:inputNumber id="editHouseFlats" value="#{flatMB.selectedFlat.house.numberOfFlatsOnFloor}"
                                   placeholder="Flats per Floor"
                                   minValue="1"
                                   required="true"
                                   requiredMessage="Flats per floor is required"/>

                    <p:inputNumber id="editHouseLifts" value="#{flatMB.selectedFlat.house.numberOfLifts}"
                                   placeholder="Number of Lifts"
                                   minValue="0"
                                   required="true"
                                   requiredMessage="Number of lifts is required"/>
                </div>

                <div class="actions">
                    <p:commandButton value="Update"
                                     icon="pi pi-check"
                                     action="#{flatMB.updateFlat}"
                                     update="flatsTable,growl"
                                     oncomplete="if(!args.validationFailed) { PF('editDialog').hide(); forceRefreshTable(); }"
                                     process="@form"/>

                    <p:commandButton value="Cancel"
                                     icon="pi pi-times"
                                     onclick="PF('editDialog').hide()"
                                     styleClass="p-button-secondary"
                                     type="button"/>
                </div>
            </h:form>
        </p:dialog>

        <!-- Диалог удаления -->
        <p:dialog header="Delete Flat"
                  widgetVar="deleteDialog"
                  modal="true"
                  resizable="false"
                  style="width: 400px;"
                  closable="true"
                  dynamic="true">
            <h:form id="deleteForm">
                <p>Are you sure you want to delete the flat: <strong>#{flatMB.selectedFlat.name}</strong>?</p>

                <div class="actions">
                    <p:commandButton value="Delete"
                                     icon="pi pi-trash"
                                     action="#{flatMB.deleteFlat}"
                                     update="flatsTable,growl"
                                     styleClass="p-button-danger"
                                     oncomplete="if(!args.validationFailed) { PF('deleteDialog').hide(); forceRefreshTable(); }"
                                     process="@this"/>

                    <p:commandButton value="Cancel"
                                     icon="pi pi-times"
                                     onclick="PF('deleteDialog').hide()"
                                     styleClass="p-button-secondary"
                                     type="button"/>
                </div>
            </h:form>
        </p:dialog>

        <!-- Уведомления -->
        <p:growl id="growl" showDetail="true" life="3000" />
    </h:form>
</h:body>
    <script type="text/javascript">
        // Функция для показа диалога создания
        function showCreateDialog() {
            console.log('showCreateDialog called');
            if (PF('createDialog')) {
                PF('createDialog').show();
                // Принудительно исправляем aria-hidden и убираем фокус с кнопок
                setTimeout(function() {
                    var dialog = document.getElementById('mainForm:createDialog');
                    if (dialog) {
                        dialog.setAttribute('aria-hidden', 'false');
                        dialog.style.display = 'block';
                        
                        // Убираем фокус с всех элементов внутри диалога
                        var focusableElements = dialog.querySelectorAll('button, input, select, textarea, a[href], [tabindex]');
                        focusableElements.forEach(function(element) {
                            element.blur();
                        });
                        
                        // Устанавливаем фокус на первый input в диалоге
                        var firstInput = dialog.querySelector('input:not([type="hidden"]), select, textarea');
                        if (firstInput) {
                            setTimeout(function() {
                                firstInput.focus();
                            }, 50);
                        }
                    }
                }, 100);
                console.log('Dialog shown');
            } else {
                console.log('Dialog widget not ready yet');
            }
        }
        
        // Функция для скрытия диалога
        function hideCreateDialog() {
            var dialog = document.getElementById('mainForm:createDialog');
            if (dialog) {
                // Убираем фокус с всех элементов перед скрытием
                var focusedElement = document.activeElement;
                if (focusedElement && dialog.contains(focusedElement)) {
                    focusedElement.blur();
                }
                
                dialog.setAttribute('aria-hidden', 'true');
                dialog.style.display = 'none';
            }
            if (PF('createDialog')) {
                PF('createDialog').hide();
            }
        }
        
        // Функция для мгновенного обновления таблицы
        function forceRefreshTable() {
            // Принудительно обновляем таблицу через AJAX
            PrimeFaces.ajax.RequestQueue.clear();
            PrimeFaces.ab({
                formId: 'mainForm',
                update: 'mainForm:flatsTable',
                process: '@none',
                async: true
            });
        }
    </script>
</html>
